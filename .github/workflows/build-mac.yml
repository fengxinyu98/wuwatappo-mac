# Builds "Wuwa Tappo.app" (universal: Apple Silicon + Intel) on a GitHub macOS runner.
# Push a tag like v1.0.2 to build and publish a GitHub Release with WuwaTappo-mac.zip.
# Running it manually from the Actions tab only uploads a 14-day build artifact.
name: build-mac

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sign with a stable self-signed identity so macOS keeps the Input Monitoring
      # grant across updates (ad-hoc signatures change every build).
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain tools/signing/codesign.cer
          rm "$RUNNER_TEMP/codesign.p12"
          security find-identity -v -p codesigning "$KC" | grep "Wuwa Tappo Personal Signing"

      - name: Build
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: Wuwa Tappo Personal Signing
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app

      - name: Verify signature
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Wuwa Tappo.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier"
          codesign -d -r- "$APP"

      - name: Zip app
        run: |
          cd "src-tauri/target/universal-apple-darwin/release/bundle/macos"
          ditto -c -k --keepParent "Wuwa Tappo.app" "$GITHUB_WORKSPACE/WuwaTappo-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WuwaTappo-mac
          path: WuwaTappo-mac.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" WuwaTappo-mac.zip \
            --title "Wuwa Tappo for Mac $GITHUB_REF_NAME" \
            --notes "解压后把 Wuwa Tappo.app 放进「应用程序」，首次运行前在终端执行：
          xattr -dr com.apple.quarantine \"/Applications/Wuwa Tappo.app\""
